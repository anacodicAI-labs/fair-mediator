repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
  - repo: local
    hooks:
      - id: notebook-json-valid
        name: notebooks must be valid JSON
        entry: python3 -c "import json,sys; [json.load(open(f)) for f in sys.argv[1:]]"
        language: system
        files: \.ipynb$
